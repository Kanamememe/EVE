<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OC Life v0.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1ec;color:#25231f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang SC",sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}#app{max-width:900px;margin:auto;padding-bottom:84px}header{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;padding:16px;background:#f4f1ecee;backdrop-filter:blur(16px)}header div{flex:1}header small{color:#8a8378;font-size:10px;letter-spacing:.16em}h1{font-size:25px;margin:2px 0}.icon{width:42px;height:42px;border:0;border-radius:14px;background:#fffdf9}main{padding:10px 16px 28px}.hero,.card{background:#fffdf9;border:1px solid #e7dfd5;border-radius:22px;padding:16px;box-shadow:0 10px 28px #0000000b}.hero{background:linear-gradient(135deg,#dfe6df,#f4ece5);margin-bottom:14px}.hero p{line-height:1.6;color:#625c54}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.primary,.secondary,.danger{border:0;border-radius:13px;padding:10px 13px;font-weight:700}.primary{background:#627064;color:white}.secondary{background:#fffdf9;border:1px solid #e7dfd5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.world{min-height:145px;display:flex;flex-direction:column}.world .emoji{font-size:30px}.world h3{margin:10px 0 4px}.meta{font-size:12px;color:#8a8378}.spacer{flex:1}.list{display:flex;flex-direction:column;gap:9px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}.avatar{width:46px;height:46px;border-radius:15px;background:#ece6dc;display:grid;place-items:center;font-size:22px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 9px}.section h2{font-size:17px;margin:0}.status h3,.chat h3{font-size:15px;margin:0 0 4px}.detail{font-size:12px;color:#8a8378;margin-top:4px}.dot{width:8px;height:8px;border-radius:50%;background:#738a75}.moment .text{white-space:pre-wrap;line-height:1.6;margin-top:10px}.comments{border-top:1px solid #e7dfd5;margin-top:9px;padding-top:7px;font-size:12px}nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(620px,calc(100% - 22px));display:grid;grid-template-columns:repeat(5,1fr);padding:7px;background:#fffdf9ee;border:1px solid #e7dfd5;border-radius:22px;box-shadow:0 12px 32px #0002}nav button{border:0;background:transparent;padding:9px 2px;border-radius:13px;color:#8a8378;font-size:12px}nav button.active{background:#e6ece6;color:#25231f;font-weight:700}.empty{text-align:center;color:#8a8378;padding:55px 20px}.modal-bg{position:fixed;inset:0;z-index:100;background:#0006;display:flex;align-items:flex-end;justify-content:center;padding:15px}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fffdf9;border-radius:25px;padding:18px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#8a8378;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #e7dfd5;border-radius:12px;padding:10px;background:white}.field textarea{min-height:78px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.messages{display:flex;flex-direction:column;gap:8px;padding-bottom:85px}.msg{max-width:78%;padding:10px 12px;border-radius:16px;line-height:1.5}.left{align-self:flex-start;background:#fffdf9;border:1px solid #e7dfd5}.right{align-self:flex-end;background:#dfe8df}.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));width:min(868px,calc(100% - 32px));display:flex;gap:7px;background:#f4f1ec;padding:7px 0}.composer input{flex:1;border:1px solid #e7dfd5;border-radius:13px;padding:10px}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"><header><button id="back" class="icon hidden">←</button><div><small id="crumb">OC LIFE</small><h1 id="title">我的世界</h1></div><button id="settings" class="icon">⚙︎</button></header><main id="view"></main><nav id="nav" class="hidden"><button data-tab="now">現在</button><button data-tab="chat">聊天</button><button data-tab="moments">動態</button><button data-tab="characters">角色</button><button data-tab="world">世界</button></nav></div><div id="modal"></div>
<script>
const KEY='oclife_v01';const uid=p=>p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);const seed={version:1,worlds:[],characters:[],statuses:[],chats:[],messages:[],moments:[],settings:{provider:'none',baseUrl:'',model:'',apiKey:''}};let db;try{db=Object.assign({},seed,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){db=structuredClone(seed)}const save=()=>localStorage.setItem(KEY,JSON.stringify(db)),all=(k,f={})=>(db[k]||[]).filter(x=>Object.entries(f).every(([a,b])=>x[a]===b)),get=(k,id)=>(db[k]||[]).find(x=>x.id===id);function add(k,o){const x={id:o.id||uid(k.slice(0,-1)),createdAt:Date.now(),...o};db[k].push(x);save();return x}function update(k,id,p){const x=get(k,id);if(x){Object.assign(x,p,{updatedAt:Date.now()});save()}return x}function createWorld(x){return add('worlds',{name:x.name||'未命名世界',emoji:x.emoji||'✦',summary:x.summary||'',era:x.era||'',location:x.location||'',rules:x.rules||''})}function createChar(x){const c=add('characters',{worldId:x.worldId,name:x.name||'未命名角色',emoji:x.emoji||'◉',identity:x.identity||'',appearance:x.appearance||'',personality:x.personality||'',speech:x.speech||'',relationships:x.relationships||'',habits:x.habits||''});add('statuses',{worldId:c.worldId,characterId:c.id,place:'未設定',activity:'正在休息',mood:'平靜',updatedAt:Date.now()});return c}function ensureChat(w,a,b){const ids=[a,b].sort();let c=db.chats.find(x=>x.worldId===w&&[...x.memberIds].sort().join('|')===ids.join('|'));return c||add('chats',{worldId:w,memberIds:ids,lastAt:0})}const pick=a=>a[Math.floor(Math.random()*a.length)];function simulate(w){const chars=all('characters',{worldId:w});for(const c of chars){const s=all('statuses').find(x=>x.characterId===c.id);if(s&&Math.random()>.55)update('statuses',s.id,{place:pick(['住處','工作地點','街上','咖啡店','房間','附近']),activity:pick(['在整理手邊的東西','剛忙完，正在放空','在吃東西','在看訊息','準備出門','剛回到住處','在處理工作','在做自己的興趣']),mood:pick(['平靜','放鬆','有點累','心情不錯','專注']),updatedAt:Date.now()})}if(chars.length>1&&Math.random()<.8){const a=pick(chars),b=pick(chars.filter(x=>x.id!==a.id)),c=ensureChat(w,a.id,b.id);add('messages',{chatId:c.id,worldId:w,senderId:a.id,text:pick(['你在做什麼','還醒著？','我剛忙完','突然有點想找你說話']),at:Date.now()-2500});add('messages',{chatId:c.id,worldId:w,senderId:b.id,text:pick(['嗯？怎麼突然問這個','還行，你呢','我知道，你一開口我就猜到了','說吧，我在聽']),at:Date.now()});update('chats',c.id,{lastAt:Date.now()})}if(chars.length&&Math.random()<.6){const c=pick(chars),s=all('statuses').find(x=>x.characterId===c.id),m=add('moments',{worldId:w,characterId:c.id,text:pick([`${s?.activity||'今天很安靜'}\n偶爾這樣也不錯`,`今天的狀態：${s?.mood||'平靜'}`,`剛從${s?.place||'外面'}回來`,'沒什麼特別的，只是想留一句']),at:Date.now(),comments:[]});const o=chars.filter(x=>x.id!==c.id);if(o.length&&Math.random()<.7){m.comments.push({characterId:pick(o).id,text:pick(['看到了','你倒是挺悠閒','嗯，知道了','晚點聊'])});save()}}}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));let wid=null,tab='now',chatId=null;const C=id=>get('characters',id),W=()=>get('worlds',wid),avatar=c=>`<div class="avatar">${esc(c?.emoji||'◉')}</div>`;function head(t,c){$('#title').textContent=t;$('#crumb').textContent=c;$('#back').classList.toggle('hidden',!wid);$('#nav').classList.toggle('hidden',!wid||!!chatId)}function modal(h){$('#modal').innerHTML=`<div class="modal-bg"><div class="modal">${h}</div></div>`;$('.modal-bg').onclick=e=>{if(e.target===e.currentTarget)$('#modal').innerHTML=''}}function worlds(){head('我的世界','OC LIFE');const a=all('worlds');$('#view').innerHTML=`<section class="hero"><h2>每一組 OC 都有自己的世界</h2><p>世界之間完全隔離。你可以只旁觀角色生活，也可以自己推進。</p></section><div class="toolbar"><button class="primary" id="nw">＋ 新建世界</button><button class="secondary" id="exp">匯出</button><button class="secondary" id="imp">匯入</button></div><div class="grid">${a.map(w=>`<article class="card world" data-w="${w.id}"><div class="emoji">${esc(w.emoji)}</div><h3>${esc(w.name)}</h3><div class="meta">${esc(w.era||'未設定時代')} · ${all('characters',{worldId:w.id}).length} 名角色</div><p class="meta">${esc(w.summary||'還沒有世界簡介')}</p><div class="spacer"></div><span class="meta">${esc(w.location||'未設定地點')} →</span></article>`).join('')}</div>${a.length?'':'<div class="empty">還沒有世界<br>先建立第一個 OC 世界</div>'}`;$('#nw').onclick=newWorld;$('#exp').onclick=exportAll;$('#imp').onclick=importAll;document.querySelectorAll('[data-w]').forEach(x=>x.onclick=()=>{wid=x.dataset.w;tab='now';render()})}function newWorld(){modal(`<h2>新建世界</h2><div class="two"><div class="field"><label>名稱</label><input id="wn"></div><div class="field"><label>圖示</label><input id="we" value="✦"></div></div><div class="field"><label>簡介</label><textarea id="ws"></textarea></div><div class="two"><div class="field"><label>時代</label><input id="wer"></div><div class="field"><label>主要地點</label><input id="wl"></div></div><div class="field"><label>世界硬規則</label><textarea id="wr"></textarea></div><div class="actions"><button class="secondary" onclick="document.getElementById('modal').innerHTML=''">取消</button><button class="primary" id="wok">建立</button></div>`);$('#wok').onclick=()=>{const w=createWorld({name:$('#wn').value,emoji:$('#we').value,summary:$('#ws').value,era:$('#wer').value,location:$('#wl').value,rules:$('#wr').value});$('#modal').innerHTML='';wid=w.id;render()}}function chatCard(c){const ms=c.memberIds.map(C).filter(Boolean),msgs=all('messages',{chatId:c.id}).sort((a,b)=>a.at-b.at),last=msgs.at(-1);return`<article class="card chat" data-c="${c.id}"><div class="row">${avatar(ms[0])}<div class="grow"><h3>${ms.map(x=>esc(x.name)).join(' × ')}</h3><div class="meta">${esc(last?.text||'還沒有對話')}</div></div></div></article>`}function now(){const w=W(),cs=all('characters',{worldId:wid});head(w.name,'現在');$('#view').innerHTML=`<section class="hero"><h2>${esc(w.emoji)} ${esc(w.name)}</h2><p>${esc(w.summary||'這個世界正在安靜地運行。')}</p></section><div class="toolbar"><button class="primary" id="go">▶ 推進一次</button></div><div class="section"><h2>現在</h2><span class="meta">${cs.length} 名角色</span></div><div class="list">${cs.map(c=>{const s=all('statuses').find(x=>x.characterId===c.id);return`<article class="card status"><div class="row">${avatar(c)}<div class="grow"><div class="row"><h3 class="grow">${esc(c.name)}</h3><span class="dot"></span></div><div>${esc(s?.activity||'尚未設定')}</div><div class="detail">${esc(s?.place||'未知')} · ${esc(s?.mood||'平靜')}</div></div></div></article>`}).join('')}</div><div class="section"><h2>最近互動</h2></div><div class="list">${all('chats',{worldId:wid}).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0)).slice(0,3).map(chatCard).join('')}</div>`;$('#go').onclick=()=>{simulate(wid);now()};document.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>openChat(x.dataset.c))}function chats(){head('聊天',W().name);const a=all('chats',{worldId:wid});$('#view').innerHTML=`<div class="toolbar"><button class="primary" id="ac">＋ 生成一次角色對話</button></div><div class="list">${a.map(chatCard).join('')}</div>${a.length?'':'<div class="empty">還沒有聊天</div>'}`;$('#ac').onclick=()=>{simulate(wid);chats()};document.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>openChat(x.dataset.c))}function openChat(id){chatId=id;const c=get('chats',id),ms=c.memberIds.map(C),msgs=all('messages',{chatId:id}).sort((a,b)=>a.at-b.at);head(ms.map(x=>x.name).join(' × '),W().name);$('#view').innerHTML=`<div class="messages">${msgs.map(m=>`<div class="msg ${m.senderId===ms[0].id?'left':'right'}"><small>${esc(C(m.senderId)?.name)}</small>${esc(m.text)}</div>`).join('')}</div><div class="composer"><select id="sender">${ms.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`)}</select><input id="text" placeholder="手動加入一句話"><button class="primary" id="send">發送</button></div>`;$('#send').onclick=()=>{const t=$('#text').value.trim();if(!t)return;add('messages',{chatId:id,worldId:wid,senderId:$('#sender').value,text:t,at:Date.now()});update('chats',id,{lastAt:Date.now()});openChat(id)}}function moments(){head('動態',W().name);const a=all('moments',{worldId:wid}).sort((x,y)=>y.at-x.at);$('#view').innerHTML=`<div class="toolbar"><button class="primary" id="am">＋ 自主發一條</button></div><div class="list">${a.map(m=>`<article class="card moment"><div class="row">${avatar(C(m.characterId))}<b>${esc(C(m.characterId)?.name)}</b></div><div class="text">${esc(m.text)}</div>${m.comments?.length?`<div class="comments">${m.comments.map(q=>`<b>${esc(C(q.characterId)?.name)}：</b>${esc(q.text)}`).join('<br>')}</div>`:''}</article>`).join('')}</div>`;$('#am').onclick=()=>{simulate(wid);moments()}}function characters(){head('角色',W().name);const a=all('characters',{worldId:wid});$('#view').innerHTML=`<div class="toolbar"><button class="primary" id="nc">＋ 新增角色</button></div><div class="list">${a.map(c=>`<article class="card"><div class="row">${avatar(c)}<div><b>${esc(c.name)}</b><div class="meta">${esc(c.identity||'身份未設定')}</div><div class="detail">${esc(c.personality||'尚未填寫性格')}</div></div></div></article>`).join('')}</div>`;$('#nc').onclick=newChar}function newChar(){modal(`<h2>新增角色</h2><div class="two"><div class="field"><label>名字</label><input id="cn"></div><div class="field"><label>圖示</label><input id="ce" value="◉"></div></div><div class="field"><label>身份／職業</label><input id="ci"></div><div class="field"><label>外貌</label><textarea id="cap"></textarea></div><div class="field"><label>性格</label><textarea id="cp"></textarea></div><div class="field"><label>說話方式</label><textarea id="cs"></textarea></div><div class="field"><label>與其他角色的關係</label><textarea id="cr"></textarea></div><div class="actions"><button class="secondary" onclick="document.getElementById('modal').innerHTML=''">取消</button><button class="primary" id="nok">建立</button></div>`);$('#nok').onclick=()=>{createChar({worldId:wid,name:$('#cn').value,emoji:$('#ce').value,identity:$('#ci').value,appearance:$('#cap').value,personality:$('#cp').value,speech:$('#cs').value,relationships:$('#cr').value});$('#modal').innerHTML='';characters()}}function worldInfo(){const w=W();head('世界資料',w.name);$('#view').innerHTML=`<dl class="card"><dt>簡介</dt><dd>${esc(w.summary||'未設定')}</dd><dt>時代</dt><dd>${esc(w.era||'未設定')}</dd><dt>主要地點</dt><dd>${esc(w.location||'未設定')}</dd><dt>世界硬規則</dt><dd>${esc(w.rules||'未設定')}</dd></dl>`}function exportAll(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='oclife-backup.json';a.click()}function importAll(){const i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=async()=>{const x=JSON.parse(await i.files[0].text());if(!Array.isArray(x.worlds))return alert('格式錯誤');db=Object.assign({},seed,x);save();render()};i.click()}function settings(){modal(`<h2>設定</h2><p class="meta">第一版先使用本地模擬。API 欄位已預留，下一版接真正 AI。</p><div class="field"><label>服務商</label><select><option>不使用 API</option><option>OpenAI 相容</option><option>Gemini</option></select></div><div class="field"><label>Base URL</label><input></div><div class="field"><label>Model</label><input></div><div class="actions"><button class="primary" onclick="document.getElementById('modal').innerHTML=''">完成</button></div>`)}function render(){chatId=null;if(!wid)return worlds();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({now,chat:chats,moments,characters,world:worldInfo}[tab]||now)()}$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render()};$('#back').onclick=()=>{if(chatId){chatId=null;return chats()}wid=null;render()};$('#settings').onclick=settings;render();
</script>
</body></html>
